
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100b18">
<title>Sue · Esfera de sorteo</title>

<style>
:root{
  color-scheme:dark;
  --pink:#ff39d2;
  --purple:#a83cff;
  --muted:#d8c4e5;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:#0d0a12;
  color:#fff;
  font:16px system-ui,-apple-system,"Segoe UI",sans-serif;
}

.wrap{
  max-width:850px;
  margin:auto;
  padding:12px;
}

.sue-hero{
  position:relative;
  width:100%;
  height:min(82svh,900px);
  min-height:490px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  margin:0 auto 12px;
  background:radial-gradient(ellipse at 50% 44%,#5a245d 0,#24102f 48%,#090811 100%);
  border-radius:18px;
}

.sue-stage{
  position:relative;
  height:96%;
  width:auto;
  aspect-ratio:2/3;
  max-width:78%;
  filter:drop-shadow(0 0 18px #ff5abf50);
}

.sue-stage .sue{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  z-index:1;
}

/* ESFERA: SOLO FOTO */
.orb-window{
  position:absolute;
  z-index:3;
  left:50%;
  top:45.7%;
  width:31%;
  aspect-ratio:1;
  transform:translate(-50%,-50%);
  border-radius:50%;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  background:radial-gradient(circle,rgba(255,190,241,.10),rgba(255,105,215,.04) 65%,transparent 72%);
}

.orb-content{
  position:relative;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.participant{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  transform:scale(.45) rotate(-15deg);
  transition:opacity .16s,transform .22s;
}

.participant.show{
  opacity:1;
  transform:scale(1) rotate(0);
}

.avatar{
  width:78%;
  height:78%;
  aspect-ratio:1;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #ffd0f3;
  box-shadow:0 0 15px #ff39d2,0 0 30px #a83cff;
  background:#24102f;
}

/* NOMBRE Y COMENTARIO DEBAJO */
.sue-caption{
  position:absolute;
  z-index:5;
  left:50%;
  bottom:10px;
  transform:translateX(-50%);
  width:min(90%,520px);
  text-align:center;
  padding:10px 14px;
  border:1px solid #ff9ee4;
  border-radius:22px;
  background:linear-gradient(135deg,#421642f2,#1b1029f5);
  box-shadow:0 0 24px #ff40b54d,inset 0 0 18px #ff5abf12;
  color:#ffc7ef;
  font-size:clamp(15px,2.5vw,22px);
  font-weight:800;
  text-shadow:0 0 12px #ff4fc3;
  overflow-wrap:anywhere;
}

.sue-caption span{
  display:block;
  color:#fff;
  font-size:clamp(11px,1.6vw,15px);
  margin-top:5px;
  font-weight:500;
  text-shadow:none;
  line-height:1.3;
  overflow-wrap:anywhere;
}

/* PANEL */
.panel{
  background:#17111f;
  border:1px solid #382044;
  border-radius:16px;
  padding:14px;
  margin:12px 0;
}

button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:11px;
  color:#fff;
  font:inherit;
  font-weight:800;
  background:linear-gradient(100deg,var(--pink),var(--purple));
  cursor:pointer;
  margin-top:7px;
}

button.secondary{
  background:#2b1c38;
  border:1px solid #53336b;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.note{
  font-size:12px;
  color:var(--muted);
  line-height:1.5;
}

.winner{
  display:none;
  text-align:center;
  padding:14px;
  border:1px solid #ff9ee4;
  border-radius:14px;
  background:#32143f;
  margin-top:12px;
}

.winner.show{display:block}

.winner img{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #ffd0f3;
  box-shadow:0 0 22px #ff39d2;
}

.winner h2{
  margin:8px 0;
  color:#ffd0f3;
}

@media(max-width:600px){
  .wrap{padding:8px}

  .sue-hero{
    height:76svh;
    min-height:440px;
    border-radius:14px;
  }

  .sue-stage{
    height:94%;
    max-width:84%;
  }

  .sue-caption{
    bottom:7px;
    padding:8px 10px;
    width:92%;
  }
}

@media(max-width:380px){
  .sue-stage{max-width:87%}
  .sue-hero{min-height:410px}
}
</style>
</head>

<body>

<main class="wrap">

  <section class="sue-hero" aria-label="Sue y esfera del sorteo">

    <div class="sue-stage">

      <img
        class="sue"
        alt="Sue sosteniendo una esfera cristalina"
        src="https://raw.githubusercontent.com/jgalindoduvan-hue/sue/main/Chica%20m%C3%A1gica%20con%20orbe%20cristalino.png"
      >

      <div class="orb-window" aria-live="polite">
        <div class="orb-content">

          <!-- SOLO LA FOTO DENTRO DE LA ESFERA -->
          <div class="participant" id="participant">
            <img class="avatar" id="avatar" alt="Foto del participante">
          </div>

        </div>
      </div>

    </div>

    <!-- NOMBRE Y COMENTARIO DEBAJO DE LA ESFERA -->
    <div class="sue-caption">
      <strong id="headline">✨ ¡Sorteo de comentarios! 💗</strong>
      <span id="subline">Esperando participantes...</span>
    </div>

  </section>

  <section class="panel">

    <button id="loadBtn">📥 Cargar participantes desde Firebase</button>

    <button id="spinBtn" disabled>🎱 Iniciar ruleta</button>

    <button id="demoBtn" class="secondary">Ver animación de prueba</button>

    <p class="note" id="status">
      Conecta Valentina desde Tampermonkey, extrae los comentarios del vídeo y después pulsa cargar participantes.
    </p>

    <div class="winner" id="winner">
      <h2>🏆 ¡TENEMOS GANADOR! 🏆</h2>
      <img id="winnerAvatar" alt="Foto del ganador">
      <h2 id="winnerName"></h2>
      <p id="winnerComment"></p>
    </div>

  </section>

</main>

<script>
/* =========================================
   CONFIGURACIÓN FIREBASE
========================================= */

const FIREBASE = {
  apiKey: 'AIzaSyA5YD-m6NZXyic16A0yHXo7RNJ5b-8U8Uk',
  databaseURL: 'https://valentina-music-default-rtdb.firebaseio.com'
};

let firebaseToken = '';

/* =========================================
   PARTICIPANTES DE DEMOSTRACIÓN
========================================= */

const demo = [
  {
    name:'@participante_01',
    username:'participante_01',
    text:'¡Yo quiero participar! 💗',
    avatar:'https://i.pravatar.cc/120?img=12'
  },
  {
    name:'@participante_02',
    username:'participante_02',
    text:'Participo, mucha suerte a todos',
    avatar:'https://i.pravatar.cc/120?img=32'
  },
  {
    name:'@participante_03',
    username:'participante_03',
    text:'Presente en este sorteo 🎉',
    avatar:'https://i.pravatar.cc/120?img=47'
  },
  {
    name:'@participante_04',
    username:'participante_04',
    text:'A ver si tengo suerte',
    avatar:'https://i.pravatar.cc/120?img=5'
  },
  {
    name:'@participante_05',
    username:'participante_05',
    text:'Me apunto',
    avatar:'https://i.pravatar.cc/120?img=20'
  }
];

/* =========================================
   VARIABLES
========================================= */

const $ = id => document.getElementById(id);

let participants = [];
let timer = null;
let busy = false;

/* =========================================
   MOSTRAR PARTICIPANTE
   Foto en la esfera.
   Nombre y comentario debajo.
========================================= */

function show(p) {

  $('avatar').src = p.avatar || '';

  $('headline').textContent =
    p.name || (p.username ? '@' + p.username : 'Participante');

  $('subline').textContent =
    p.text || 'Participando en el sorteo';

  $('participant').classList.add('show');
}

/* =========================================
   CONECTAR CON FIREBASE
========================================= */

async function connectFirebase() {

  if (firebaseToken) return firebaseToken;

  const response = await fetch(
    `https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${encodeURIComponent(FIREBASE.apiKey)}`,
    {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({returnSecureToken:true})
    }
  );

  const data = await response.json();

  if (!response.ok) {
    throw new Error(data.error?.message || 'No se pudo autenticar con Firebase');
  }

  firebaseToken = data.idToken;

  return firebaseToken;
}

/* =========================================
   CARGAR PARTICIPANTES DESDE FIREBASE
========================================= */

async function loadParticipants() {

  const button = $('loadBtn');

  button.disabled = true;
  button.textContent = 'Conectando...';

  try {

    const token = await connectFirebase();

    $('status').textContent = 'Buscando participantes guardados por Valentina...';

    const url =
      `${FIREBASE.databaseURL}/rooms/main/raffle/current.json?auth=${encodeURIComponent(token)}`;

    const response = await fetch(url);

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || 'No se pudieron leer los participantes');
    }

    if (!data || !Array.isArray(data.participants)) {
      throw new Error('Todavía no hay participantes. Primero extrae los comentarios desde TikTok.');
    }

    const unique = new Map();

    for (const p of data.participants) {

      const username = String(p.username || p.name || '').replace(/^@/, '').trim();

      if (!username) continue;

      const key = username.toLowerCase();

      if (!unique.has(key)) {
        unique.set(key, {
          name: p.name || '@' + username,
          username,
          text: p.text || 'Participando en el sorteo',
          avatar: p.avatar || ''
        });
      }
    }

    participants = [...unique.values()];

    if (!participants.length) {
      throw new Error('La lista recibida no contiene participantes válidos.');
    }

    $('spinBtn').disabled = false;
    $('winner').classList.remove('show');

    $('headline').textContent = '💗 ¡Participantes cargados!';
    $('subline').textContent = `${participants.length} participantes únicos preparados`;

    $('status').textContent =
      `✅ Se cargaron ${participants.length} participantes desde Firebase. Ya puedes iniciar la ruleta.`;

    show(participants[0]);

  } catch (error) {

    $('status').textContent = 'Error: ' + error.message;

  } finally {

    button.disabled = false;
    button.textContent = '📥 Cargar participantes desde Firebase';

  }
}

$('loadBtn').addEventListener('click', loadParticipants);

/* =========================================
   MODO DE PRUEBA
========================================= */

function enableDemo() {

  participants = demo.slice();

  $('spinBtn').disabled = false;
  $('winner').classList.remove('show');

  $('headline').textContent = '✨ Modo de prueba';
  $('subline').textContent = 'Participantes ficticios';

  $('status').textContent =
    'Modo de demostración: estos participantes son ficticios.';

  show(participants[0]);
}

window.previewSueRoulette = enableDemo;

$('demoBtn').addEventListener('click', enableDemo);

/* =========================================
   RULETA
========================================= */

$('spinBtn').addEventListener('click', () => {

  if (busy || !participants.length) return;

  busy = true;

  $('spinBtn').disabled = true;
  $('loadBtn').disabled = true;

  $('winner').classList.remove('show');

  $('headline').textContent = '✨ ¡Mucha suerte! ✨';
  $('subline').textContent = 'La esfera está eligiendo…';

  let count = 0;
  let delay = 65;
  let chosen = null;

  const tick = () => {

    chosen = participants[
      Math.floor(Math.random() * participants.length)
    ];

    show(chosen);

    count++;

    delay = Math.min(420, delay + count * 1.65);

    if (count < 34) {

      timer = setTimeout(tick, delay);

    } else {

      busy = false;

      $('headline').textContent = '🏆 ¡TENEMOS GANADOR!';
      $('subline').textContent =
        chosen.name || '@' + chosen.username;

      $('winnerAvatar').src = chosen.avatar || '';
      $('winnerName').textContent =
        chosen.name || '@' + chosen.username;

      $('winnerComment').textContent =
        '“' + (chosen.text || '') + '”';

      $('winner').classList.add('show');

      $('spinBtn').disabled = false;
      $('loadBtn').disabled = false;

    }
  };

  tick();

});

</script>

</body>
</html>
